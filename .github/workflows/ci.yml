name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Build unified data and link report
        env:
          PYTHONPATH: src
        run: |
          python -m hands_on_search.etl
          cat build/link_report.md
      - name: Run tests (includes golden queries and link fabrication checks)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q
